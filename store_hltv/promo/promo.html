<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CS2 Pro Predictor (HLTV) — promo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body {
      background: #0a0e14;
      color: #e6edf3;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      position: relative;
    }
    .glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(280px 220px at 12% 8%, rgba(31, 111, 235, .30), transparent 70%),
        radial-gradient(300px 260px at 95% 100%, rgba(88, 166, 255, .16), transparent 70%),
        linear-gradient(145deg, #0b1016, #090c10);
    }
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at 30% 45%, #000, transparent 75%);
    }
    .wrap { position: relative; z-index: 1; padding: 34px 32px; }
    img { width: 58px; height: 58px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    h1 { margin: 20px 0 8px; font-size: 30px; line-height: 1.04; letter-spacing: -1px; font-weight: 800; }
    h1 span { color: #58a6ff; }
    p { margin: 0; color: #9aa7b4; font-size: 12px; letter-spacing: .4px; }
    .tag { position: absolute; right: 26px; bottom: 24px; color: #5b6673; font-size: 9px; letter-spacing: .3px; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="wrap">
    <img src="/hltv_extension/icon.png" alt="">
    <h1>CS2 Pro<br><span>Predictor (HLTV)</span></h1>
    <p>Своя ML-модель · live-пересчёт · вето</p>
  </div>
  <div class="tag">for HLTV match pages</div>
</body>
</html>
